<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
    <head th:replace="~{general/fragmentos ::head}" ></head>
    <body>
        <header th:replace="~{general/fragmentos ::header}" ></header>

        <section class="container text-center py-4">
            <h2 class="titulo mb-4">[[#{contacto.titulo}]]</h2>
            <div class="tarjeta shadow-sm p-4 mx-auto" style="max-width: 450px">
                <p><i class="fa-solid fa-location-dot"></i> [[#{contacto.direccion}]]</p>
                <p><i class="fa-regular fa-clock"></i> [[#{contacto.horario}]]</p>
                <p><i class="fa-brands fa-whatsapp"></i> [[#{contacto.telefono}]]</p>
                <a th:href="@{/cliente/reservar}" class="btn btn-navaja px-4">[[#{index.boton}]]</a>
            </div>
        </section>

        <footer th:replace="~{general/fragmentos ::footer}" ></footer>
    </body>
</html>
