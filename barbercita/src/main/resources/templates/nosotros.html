<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
    <head th:replace="~{general/fragmentos ::head}" ></head>
    <body>
        <header th:replace="~{general/fragmentos ::header}" ></header>

        <div class="banner"></div>

        <section class="container text-center py-4">
            <h2 class="titulo mb-4">[[#{nosotros.titulo}]]</h2>
            <div class="row g-4 justify-content-center">
                <div class="col-md-4">
                    <h4 class="titulo">[[#{nosotros.mision}]]</h4>
                    <div class="caja-verde p-3">[[#{nosotros.mision.texto}]]</div>
                </div>
                <div class="col-md-4">
                    <h4 class="titulo">[[#{nosotros.vision}]]</h4>
                    <div class="caja-beige p-3">[[#{nosotros.vision.texto}]]</div>
                </div>
                <div class="col-md-4">
                    <h4 class="titulo">[[#{nosotros.filosofia}]]</h4>
                    <div class="caja-verde p-3">[[#{nosotros.filosofia.texto}]]</div>
                </div>
            </div>
        </section>

        <footer th:replace="~{general/fragmentos ::footer}" ></footer>
    </body>
</html>
