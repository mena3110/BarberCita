<section th:fragment="listado">
    <div class="container mt-4">
        <div class="text-center mb-4">
            <h2>MI AGENDA</h2>
            <p class="text-muted">
                Detalle de las citas agendadas para el día
            </p>
            <div class="text-end mb-3">
    <form method="get"
          th:action="@{/barbero/agenda}">
        <input type="date"
               name="fecha"
               class="form-control d-inline-block w-auto"
               th:value="${fechaSeleccionada}">

        <button type="submit"
                class="btn btn-dark btn-sm">
            Consultar
        </button>
    </form>
</div>

        </div>
        <div class="row">
            <!-- Próxima cita -->
            <div class="col-md-4">
                <div class="card border-0 shadow-sm bg-success-subtle">
                    <div class="card-body">
                        <h5 class="card-title">
                            Próxima cita
                        </h5>
                        <div th:if="${!citas.isEmpty()}">
                            <h4 th:text="${citas[0].hora}">
                                10:00
                            </h4>
                            <p>
                                <strong>Cliente:</strong>
                                <span th:text="${citas[0].cliente.nombre}">
                                </span>
                            </p>
                            <p>
                                <strong>Servicio:</strong>
                                <span th:text="${citas[0].servicio.nombre}">
                                </span>
                            </p>
                            <p>
                                <strong>Estado:</strong>
                                <span th:text="${citas[0].estado}">
                                </span>
                            </p>
                        </div>
                        <div th:if="${citas.isEmpty()}">
                            <p>No hay citas programadas para el día seleccionado.</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Agenda del día -->
            <div class="col-md-8">
                <!-- Encabezados -->
                <div class="row fw-bold text-muted mb-2 px-3">
                    <div class="col-md-2">
                        Hora
                    </div>
                    <div class="col-md-4">
                        Cliente
                    </div>
                    <div class="col-md-3">
                        Servicio
                    </div>
                    <div class="col-md-3 text-end">
                        Estado
                    </div>
                </div>
                <div th:each="cita : ${citas}"
                     class="card mb-3 shadow-sm">
                    <div class="card-body">
                        <div class="row align-items-center">
                            <div class="col-md-2">
                                <strong th:text="${cita.hora}">
                                </strong>
                            </div>      
                            <div class="col-md-4">
                                <span th:text="${cita.cliente.nombre}">
                                    Cliente
                                </span>
                            </div>
                            <div class="col-md-3">
                                <span th:text="${cita.servicio.nombre}">
                                    Servicio
                                </span>
                            </div>
                            <div class="col-md-3 text-end">
                                <span th:if="${cita.estado == 'Pendiente'}"
                                      class="badge bg-warning text-dark">
                                    Pendiente
                                </span>
                                <span th:if="${cita.estado == 'Atendida'}"
                                      class="badge bg-success">
                                    Atendida
                                </span>
                                <span th:if="${cita.estado == 'Cancelada'}"
                                      class="badge bg-danger">
                                    Cancelada
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>  
    </div>  
</section>
