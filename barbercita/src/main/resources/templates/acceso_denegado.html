<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
    <head th:replace="~{general/fragmentos ::head}" ></head>
    <body class="fondo-reserva">
        <header th:replace="~{general/fragmentos ::header}" ></header>

        <!-- Persona 1: se muestra cuando el usuario no tiene el rol para entrar -->
        <section class="container py-5">
            <div class="panel-reserva panel-login contenedor-denegado mx-auto p-5 text-center">
                <span class="icono-grande mb-3"><i class="fa-solid fa-user-lock"></i></span>
                <h4 class="titulo">[[#{acceso.titulo}]]</h4>
                <p class="text-secondary">[[#{acceso.texto}]]</p>
                <a th:href="@{/}" class="btn btn-navaja px-4 mt-2">[[#{acceso.volver}]]</a>
            </div>
        </section>

        <footer th:replace="~{general/fragmentos ::footer}" ></footer>
    </body>
</html>
